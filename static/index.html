<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contador de ejercicios</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #3d9cf5;
      --text: #e8eef5;
      --muted: #8b9cb3;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 1.25rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .panel {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .choices { display: flex; flex-direction: column; gap: 0.5rem; }
    @media (min-width: 560px) {
      .choices { flex-direction: row; flex-wrap: wrap; }
    }
    label.choice {
      flex: 1;
      min-width: 160px;
      padding: 0.75rem 1rem;
      border: 2px solid #2a3a52;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    label.choice:hover { border-color: var(--accent); }
    input[type="radio"] { accent-color: var(--accent); margin-right: 0.5rem; }
    input[type="radio"]:checked + span { font-weight: 600; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
    button {
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary { background: var(--accent); color: #04121f; }
    button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
    button.ghost { background: #2a3a52; color: var(--text); }
    .video-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4 / 3;
      max-height: 70vh;
    }
    video { display: none; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 480px) { .stats { grid-template-columns: 1fr; } }
    .stat {
      background: #243044;
      padding: 1rem;
      border-radius: 8px;
    }
    .stat .label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat .value { font-size: 1.75rem; font-weight: 700; }
    .hint {
      margin-top: 0.75rem;
      padding: 0.75rem 1rem;
      background: #243044;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
      font-size: 0.95rem;
    }
    .status { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
    .status.live { color: var(--ok); }
    .status.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Contador de ejercicios</h1>
    <p class="sub">
      Elige un ejercicio y pulsa Empezar. La pose se analiza en tu navegador con MediaPipe (sin enviar vídeo al servidor).
    </p>

    <div class="panel">
      <div class="choices">
        <label class="choice">
          <input type="radio" name="ex" value="squat" checked />
          <span>1) Sentadillas</span>
        </label>
        <label class="choice">
          <input type="radio" name="ex" value="pushup" />
          <span>2) Flexiones de pecho</span>
        </label>
        <label class="choice">
          <input type="radio" name="ex" value="knee_raise" />
          <span>3) Rodillas al pecho (rodillas altas)</span>
        </label>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="btnStart">Empezar</button>
        <button type="button" class="ghost" id="btnStop" disabled>Detener</button>
      </div>
      <p class="status" id="status">Listo</p>
    </div>

    <div class="panel">
      <div class="video-wrap">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
    </div>

    <div class="panel stats">
      <div class="stat">
        <div class="label">Repeticiones</div>
        <div class="value" id="reps">0</div>
      </div>
      <div class="stat">
        <div class="label">Fase</div>
        <div class="value" id="phase" style="font-size:1.1rem;">—</div>
      </div>
    </div>
    <div class="hint" id="hint">Selecciona un ejercicio y pulsa Empezar.</div>
  </div>

  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver,
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const POSE_MODEL =
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task";
    const WASM_BASE =
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

    const L = {
      LEFT_SHOULDER: 11,
      RIGHT_SHOULDER: 12,
      LEFT_ELBOW: 13,
      RIGHT_ELBOW: 14,
      LEFT_WRIST: 15,
      RIGHT_WRIST: 16,
      LEFT_HIP: 23,
      RIGHT_HIP: 24,
      LEFT_KNEE: 25,
      RIGHT_KNEE: 26,
      LEFT_ANKLE: 27,
      RIGHT_ANKLE: 28,
    };

    function angleDegrees(lm, a, b, c) {
      if (lm[a] == null || lm[b] == null || lm[c] == null) return null;
      const [ax, ay, az] = lm[a];
      const [bx, by, bz] = lm[b];
      const [cx, cy, cz] = lm[c];
      const bax = ax - bx, bay = ay - by, baz = az - bz;
      const bcx = cx - bx, bcy = cy - by, bcz = cz - bz;
      const nba = Math.hypot(bax, bay, baz);
      const nbc = Math.hypot(bcx, bcy, bcz);
      if (nba < 1e-6 || nbc < 1e-6) return null;
      let cos = (bax * bcx + bay * bcy + baz * bcz) / (nba * nbc);
      cos = Math.max(-1, Math.min(1, cos));
      return (Math.acos(cos) * 180) / Math.PI;
    }

    function avgTwo(a, b) {
      if (a != null && b != null) return (a + b) / 2;
      return a != null ? a : b;
    }

    function landmarksToMap(arr, minVis = 0.5) {
      const m = {};
      arr.forEach((p, i) => {
        if (p.visibility >= minVis) m[i] = [p.x, p.y, p.z, p.visibility];
      });
      return Object.keys(m).length ? m : null;
    }

    class SquatCounter {
      constructor() {
        this.reps = 0;
        this.phase = "up";
        this.TH_DOWN = 125;
        this.TH_UP = 155;
      }
      update(lm) {
        const left = angleDegrees(lm, L.LEFT_HIP, L.LEFT_KNEE, L.LEFT_ANKLE);
        const right = angleDegrees(lm, L.RIGHT_HIP, L.RIGHT_KNEE, L.RIGHT_ANKLE);
        const knee = avgTwo(left, right);
        let hint = "Colócate de perfil y asegura que se vean piernas completas.";
        if (knee == null) {
          return { rep_count: this.reps, phase: this.phase, ok: false, hint, angle: null };
        }
        if (this.phase === "up" && knee < this.TH_DOWN) {
          this.phase = "down";
          hint = "Buena bajada; sube controlando las rodillas.";
        } else if (this.phase === "down" && knee > this.TH_UP) {
          this.reps += 1;
          this.phase = "up";
          hint = "Repetición válida. Sigue.";
        } else if (this.phase === "down") {
          hint = "Sube hasta estirar casi por completo las piernas.";
        } else {
          hint = "Baja hasta que los muslos queden al menos paralelos al suelo.";
        }
        return {
          rep_count: this.reps,
          phase: this.phase,
          ok: true,
          hint,
          angle: Math.round(knee * 10) / 10,
        };
      }
    }

    class PushupCounter {
      constructor() {
        this.reps = 0;
        this.phase = "up";
        this.TH_BENT = 105;
        this.TH_STRAIGHT = 145;
      }
      update(lm) {
        const left = angleDegrees(lm, L.LEFT_SHOULDER, L.LEFT_ELBOW, L.LEFT_WRIST);
        const right = angleDegrees(lm, L.RIGHT_SHOULDER, L.RIGHT_ELBOW, L.RIGHT_WRIST);
        const elbow = avgTwo(left, right);
        let hint = "Asegura que cámara vea brazos y torso (plancha).";
        if (elbow == null) {
          return { rep_count: this.reps, phase: this.phase, ok: false, hint, angle: null };
        }
        if (
          lm[L.LEFT_SHOULDER] == null ||
          lm[L.RIGHT_SHOULDER] == null ||
          lm[L.LEFT_HIP] == null ||
          lm[L.RIGHT_HIP] == null
        ) {
          return { rep_count: this.reps, phase: this.phase, ok: false, hint, angle: Math.round(elbow * 10) / 10 };
        }
        const sy = (lm[L.LEFT_SHOULDER][1] + lm[L.RIGHT_SHOULDER][1]) / 2;
        const hy = (lm[L.LEFT_HIP][1] + lm[L.RIGHT_HIP][1]) / 2;
        const torsoTilt = Math.abs(sy - hy);
        if (torsoTilt >= 0.22) {
          hint = "Cuerpo más horizontal: hombros y cadera alineados en plancha.";
          return {
            rep_count: this.reps,
            phase: this.phase,
            ok: false,
            hint,
            angle: Math.round(elbow * 10) / 10,
          };
        }
        if (this.phase === "up" && elbow < this.TH_BENT) {
          this.phase = "down";
          hint = "Abajo bien; empuja el suelo al subir.";
        } else if (this.phase === "down" && elbow > this.TH_STRAIGHT) {
          this.reps += 1;
          this.phase = "up";
          hint = "Repetición válida.";
        } else if (this.phase === "down") {
          hint = "Extiende los codos casi por completo.";
        } else {
          hint = "Baja el pecho flexionando codos hacia atrás.";
        }
        return {
          rep_count: this.reps,
          phase: this.phase,
          ok: true,
          hint,
          angle: Math.round(elbow * 10) / 10,
        };
      }
    }

    class KneeRaiseCounter {
      constructor() {
        this.reps = 0;
        this.leftPhase = "down";
        this.rightPhase = "down";
        this.LIFT = 0.07;
        this.CLEAR = 0.02;
      }
      update(lm) {
        let hint = "De pie; que se vean caderas y rodillas.";
        if (
          lm[L.LEFT_HIP] == null ||
          lm[L.LEFT_KNEE] == null ||
          lm[L.RIGHT_HIP] == null ||
          lm[L.RIGHT_KNEE] == null
        ) {
          return { rep_count: this.reps, phase: "neutral", ok: false, hint, angle: null };
        }
        const lkY = lm[L.LEFT_KNEE][1];
        const lhY = lm[L.LEFT_HIP][1];
        const rkY = lm[L.RIGHT_KNEE][1];
        const rhY = lm[L.RIGHT_HIP][1];
        const leftUp = lkY < lhY - this.LIFT;
        const rightUp = rkY < rhY - this.LIFT;
        const leftClear = lkY > lhY - this.CLEAR;
        const rightClear = rkY > rhY - this.CLEAR;

        let repThisFrame = false;
        if (this.leftPhase === "down" && leftUp) this.leftPhase = "up";
        else if (this.leftPhase === "up" && leftClear) {
          this.reps += 1;
          this.leftPhase = "down";
          repThisFrame = true;
          hint = "Buena repetición (pierna izquierda).";
        }

        if (this.rightPhase === "down" && rightUp) this.rightPhase = "up";
        else if (this.rightPhase === "up" && rightClear) {
          this.reps += 1;
          this.rightPhase = "down";
          repThisFrame = true;
          hint = "Buena repetición (pierna derecha).";
        }

        const phase = this.leftPhase === "up" || this.rightPhase === "up" ? "up" : "down";
        if (!repThisFrame) hint = "Eleva cada rodilla por encima de la cadera y vuelve a bajar.";
        const liftL = lhY - lkY;
        const liftR = rhY - rkY;
        return {
          rep_count: this.reps,
          phase,
          ok: true,
          hint,
          angle: Math.round(Math.max(liftL, liftR) * 1000),
        };
      }
    }

    function makeCounter(kind) {
      if (kind === "squat") return new SquatCounter();
      if (kind === "pushup") return new PushupCounter();
      if (kind === "knee_raise") return new KneeRaiseCounter();
      return new SquatCounter();
    }

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const btnStart = document.getElementById("btnStart");
    const btnStop = document.getElementById("btnStop");
    const statusEl = document.getElementById("status");
    const repsEl = document.getElementById("reps");
    const phaseEl = document.getElementById("phase");
    const hintEl = document.getElementById("hint");

    let stream = null;
    let raf = null;
    let drawRunning = false;
    let poseLandmarker = null;
    let counter = null;
    let lastVideoTime = -1;

    function selectedExercise() {
      const r = document.querySelector('input[name="ex"]:checked');
      return r ? r.value : "squat";
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = "status " + (cls || "");
    }

    function applyUi(out) {
      repsEl.textContent = String(out.rep_count);
      phaseEl.textContent = out.phase || "—";
      if (out.hint) hintEl.textContent = out.hint;
    }

    async function ensurePose() {
      if (poseLandmarker) return;
      setStatus("Cargando MediaPipe (puede tardar la primera vez)…");
      const vision = await FilesetResolver.forVisionTasks(WASM_BASE);
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: POSE_MODEL,
          delegate: "CPU",
        },
        runningMode: "VIDEO",
        numPoses: 1,
        minPoseDetectionConfidence: 0.5,
        minPosePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });
    }

    function frameLoop(ts) {
      if (!drawRunning) return;

      if (stream && video.videoWidth > 0 && video.videoHeight > 0) {
        const w = 480;
        const h = Math.round((video.videoHeight / video.videoWidth) * w);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        ctx.save();
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, w, h);
        ctx.restore();

        if (poseLandmarker && lastVideoTime !== video.currentTime) {
          lastVideoTime = video.currentTime;
          const result = poseLandmarker.detectForVideo(video, ts);
          const raw = result.landmarks && result.landmarks[0];
          if (raw) {
            const lm = landmarksToMap(raw);
            if (lm && counter) applyUi(counter.update(lm));
            else {
              applyUi({
                rep_count: counter ? counter.reps : 0,
                phase: "neutral",
                hint: "No se detecta una pose clara. Colócate frente a la cámara.",
              });
            }
          } else if (counter) {
            applyUi({
              rep_count: counter.reps,
              phase: "neutral",
              hint: "No se detecta una pose. Colócate frente a la cámara.",
            });
          }
        }
      }

      if (drawRunning) raf = requestAnimationFrame(frameLoop);
    }

    function startLoop() {
      if (drawRunning) return;
      drawRunning = true;
      lastVideoTime = -1;
      raf = requestAnimationFrame(frameLoop);
    }

    function stopLoop() {
      drawRunning = false;
      if (raf != null) {
        cancelAnimationFrame(raf);
        raf = null;
      }
    }

    function stopAll() {
      stopLoop();
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      video.srcObject = null;
      counter = null;
      btnStart.disabled = false;
      btnStop.disabled = true;
      setStatus("Listo");
      hintEl.textContent = "Selecciona un ejercicio y pulsa Empezar.";
      repsEl.textContent = "0";
      phaseEl.textContent = "—";
    }

    function playVideoWhenReady(v) {
      v.muted = true;
      v.playsInline = true;
      return new Promise((resolve, reject) => {
        const run = () => v.play().then(resolve).catch(reject);
        if (v.readyState >= 1) run();
        else v.addEventListener("loadedmetadata", run, { once: true });
      });
    }

    btnStop.addEventListener("click", stopAll);

    btnStart.addEventListener("click", async () => {
      if (stream) return;

      btnStart.disabled = true;
      try {
        await ensurePose();
      } catch (e) {
        btnStart.disabled = false;
        setStatus("Error al cargar MediaPipe", "err");
        hintEl.textContent = (e && e.message) || String(e);
        return;
      }

      counter = makeCounter(selectedExercise());

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
      } catch {
        btnStart.disabled = false;
        setStatus("No se pudo acceder a la cámara.", "err");
        hintEl.textContent = "Permite la cámara (localhost o HTTPS).";
        return;
      }

      video.srcObject = stream;
      try {
        await playVideoWhenReady(video);
      } catch (e) {
        stopAll();
        setStatus("No se pudo iniciar el vídeo.", "err");
        hintEl.textContent =
          e && e.name === "AbortError"
            ? "Reintenta sin doble clic en Empezar."
            : (e && e.message) || String(e);
        return;
      }

      btnStop.disabled = false;
      setStatus("Analizando pose en el navegador…", "live");
      hintEl.textContent = "Comienza el ejercicio. Mantente frente a la cámara.";
      startLoop();
    });
  </script>
</body>
</html>
